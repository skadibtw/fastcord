[package]
name = "fastcord-app"
description = "fastcord desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fastcord"
path = "src/main.rs"

[features]
# Test-only fake mode (`--fake-discord <port>`), debug builds only: talks to the
# loopback `fastcord-fake` server and never touches the credential store.
fake-discord = ["fastcord-discord/fake-discord"]

[dependencies]
fastcord-net.workspace = true
fastcord-model.workspace = true
fastcord-discord.workspace = true
fastcord-platform.workspace = true
fastcord-media.workspace = true
fastcord-audio.workspace = true
fastcord-video.workspace = true
iced.workspace = true
iced_renderer.workspace = true
iced_tiny_skia.workspace = true
bytemuck.workspace = true
softbuffer.workspace = true
tiny-skia.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
zeroize.workspace = true
futures-util.workspace = true
reqwest.workspace = true
image.workspace = true
filetime.workspace = true
time.workspace = true
sha2.workspace = true
rfd.workspace = true
parking_lot.workspace = true
bytes.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
sys-locale.workspace = true

[target.'cfg(windows)'.dependencies]
tao.workspace = true
wry.workspace = true

[lints]
workspace = true
