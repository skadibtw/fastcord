[package]
name = "fastcord-fake"
description = "Local fake Discord server for offline testing of fastcord (test-only, not packaged)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "fastcord-fake"
path = "src/main.rs"

[dependencies]
fastcord-net.workspace = true
flate2.workspace = true
futures-util.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-tungstenite.workspace = true

[dev-dependencies]
fastcord-discord = { workspace = true, features = ["fake-discord"] }
fastcord-model.workspace = true
fastcord-platform = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["io-util", "time"] }

[lints]
workspace = true
