[package]
name = "fastcord-discord"
description = "Discord REST transport, remote-auth login, scheduling, and control-plane state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Test-only: lets the loopback fake Discord server (crates/fastcord-fake) stand in
# for Discord. Debug builds only; see `fake_origin`.
fake-discord = []

[dependencies]
fastcord-net.workspace = true
fastcord-model.workspace = true
fastcord-ws.workspace = true
base64.workspace = true
bytes.workspace = true
flate2.workspace = true
futures-util.workspace = true
rand_core.workspace = true
reqwest.workspace = true
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-tungstenite.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
http.workspace = true
fastcord-ws = { workspace = true, features = ["test-support"] }
parking_lot.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
