[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/block", "vendor/coreaudio-rs"]

# coreaudio-rs 0.14.2 leaks callback allocations when registration fails (#68).
# block 0.1.6 declares an uninhabited foreign static; keep Metal's existing
# dependency/API while fixing its opaque class declaration (see provenance).
[patch.crates-io]
block = { path = "vendor/block" }
coreaudio-rs = { path = "vendor/coreaudio-rs" }

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/skadibtw/fastcord"

[workspace.dependencies]
fastcord-model = { path = "crates/fastcord-model" }
fastcord-discord = { path = "crates/fastcord-discord" }
fastcord-platform = { path = "crates/fastcord-platform" }
fastcord-media = { path = "crates/fastcord-media" }
fastcord-audio = { path = "crates/fastcord-audio" }
fastcord-video = { path = "crates/fastcord-video" }
fastcord-bypass = { path = "crates/fastcord-bypass" }
cc = "1"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "zeroize"] }
# Linux screen capture (milestone 33): the ScreenCast portal (already in the
# tree through rfd) and PipeWire, which links the system libpipewire-0.3.
ashpd = { version = "0.11.1", default-features = false, features = ["tokio"] }
pipewire = "0.10.1"
# macOS screen capture (milestone 34): ScreenCaptureKit through the objc2
# framework bindings (the objc2 0.6 family is already in the tree via cpal).
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6.5"
# macOS menu-bar icon (#105); the same objc2-app-kit 0.3 that winit uses.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSButton", "NSControl", "NSView", "NSResponder", "NSMenu", "NSMenuItem", "NSImage", "objc2-core-foundation"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGDisplayStream", "CGWindow"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "CMBase", "CMBlockBuffer", "objc2-core-audio-types", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSData", "NSEnumerator", "NSError", "NSGeometry", "NSString", "NSObject"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "SCStream", "SCShareableContent", "SCError", "block2", "dispatch2", "libc", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }
base64 = "0.22"
bytes = "1"
bytemuck = "1"
cpal = { version = "0.18", features = ["realtime"] }
audio_thread_priority = { version = "0.35", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
davey = { version = "=0.1.4" }
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "978576aa8400552a4ce9730838c635aa30db5e61", default-features = false, features = ["tract", "default-model"] }
ndarray = { version = "0.15", default-features = false }
nnnoiseless = { version = "=0.5.2", default-features = false }
# Bundled Cisco OpenH264 source built by `openh264-sys2` via `cc` (card 030 /
# #30); the version pin tracks the upstream hash recorded in ADR 0001.
openh264 = { version = "=0.9.8" }
openmls = { version = "=0.8.1" }
openmls_basic_credential = { version = "=0.5.0" }
openmls_rust_crypto = { version = "=0.5.1" }
openmls_traits = { version = "=0.5.0" }
tls_codec = { version = "=0.4.2" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
iced = { version = "0.14", default-features = false, features = ["advanced", "canvas", "image", "wgpu", "tiny-skia", "tokio", "x11", "wayland", "qr_code"] }
iced_renderer = { version = "0.14", default-features = false }
iced_tiny_skia = { version = "0.14", default-features = false, features = ["image"] }
keyring-core = "1.0.0"
opus2 = { version = "0.4", default-features = false, features = ["backend-libopus", "static", "bundled"] }
parking_lot = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "http2", "stream"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
filetime = "0.2"
rfd = { version = "0.15.2", default-features = false, features = ["tokio", "xdg-portal"] }
rsa = { version = "0.9.10", default-features = false, features = ["std", "u64_digit"] }
rubato = { version = "5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_repr = "0.1"
sha2 = "0.10"
symphonia-bundle-mp3 = { version = "0.6.1", default-features = false, features = ["mp3"] }
symphonia-codec-aac = "0.6.1"
symphonia-core = { version = "0.6.1", default-features = false }
sys-locale = "0.3"
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
time = { version = "0.3", default-features = false, features = ["std", "parsing", "local-offset"] }
tar = { version = "0.4", default-features = false }
# The ONNX runtime DeepFilterNet already pulls in; the camera background model uses it too (ADR 0010).
tract-onnx = "=0.19.16"
# Linux tray icon pixmaps (#105); already in the tree through `image`.
png = { version = "0.18.1", default-features = false }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
webpki-roots = "1"
windows = "0.62"
uuid = { version = "1", features = ["std", "v4"] }
windows-core = "0.62"
zeroize = { version = "1", features = ["serde"] }
unicode-segmentation = "=1.13.3"
windows-native-keyring-store = "1.1.0"
# Linux tray icon objects (#105); the zbus 5 that ashpd and the keyring use.
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["crypto-rust"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = "line-tables-only"
split-debuginfo = "packed"

# QR login generates a 2048-bit RSA key per attempt; unoptimized bignum code
# would take many seconds in debug builds.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
