[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/skadibtw/fastcord"

[workspace.dependencies]
fastcord-model = { path = "crates/fastcord-model" }
fastcord-discord = { path = "crates/fastcord-discord" }
bytes = "1"
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "thread-pool", "x11", "wayland"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = "line-tables-only"
split-debuginfo = "packed"
