[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/skadibtw/fastcord"

[workspace.dependencies]
fastcord-model = { path = "crates/fastcord-model" }
fastcord-discord = { path = "crates/fastcord-discord" }
fastcord-platform = { path = "crates/fastcord-platform" }
fastcord-media = { path = "crates/fastcord-media" }
fastcord-audio = { path = "crates/fastcord-audio" }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "zeroize"] }
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }
base64 = "0.22"
bytes = "1"
cpal = "0.18"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
davey = { version = "=0.1.4" }
openmls = { version = "=0.8.1" }
openmls_basic_credential = { version = "=0.5.0" }
openmls_rust_crypto = { version = "=0.5.1" }
openmls_traits = { version = "=0.5.0" }
tls_codec = { version = "=0.4.2" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
iced = { version = "0.14", default-features = false, features = ["advanced", "image", "wgpu", "tiny-skia", "tokio", "x11", "wayland", "qr_code"] }
iced_renderer = { version = "0.14", default-features = false }
keyring-core = "1.0.0"
opus2 = { version = "0.4", default-features = false, features = ["backend-libopus", "static", "bundled"] }
parking_lot = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "http2", "stream"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
filetime = "0.2"
rfd = { version = "0.15.2", default-features = false, features = ["tokio", "xdg-portal"] }
rsa = { version = "0.9.10", default-features = false, features = ["std", "u64_digit"] }
rubato = { version = "5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_repr = "0.1"
sha2 = "0.10"
sys-locale = "0.3"
time = { version = "0.3", default-features = false, features = ["std", "parsing"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
webpki-roots = "1"
windows = "0.62"
windows-core = "0.62"
zeroize = { version = "1", features = ["serde"] }
windows-native-keyring-store = "1.1.0"
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["crypto-rust"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = "line-tables-only"
split-debuginfo = "packed"

# QR login generates a 2048-bit RSA key per attempt; unoptimized bignum code
# would take many seconds in debug builds.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
