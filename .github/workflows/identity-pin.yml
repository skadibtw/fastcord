name: Identity pin

# ADR 0005: check host/native pins for Windows x64/ARM64, macOS x64/ARM64,
# and Linux x64 against public manifests, plus the web build. Runtime pair
# evidence is still Windows x64 only; manifest checks cannot confirm it on
# another target. Never downloads the Discord package.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p fastcord-discord --lib --locked live_version_chain -- --ignored --nocapture
