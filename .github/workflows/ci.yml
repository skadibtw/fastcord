name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Audit application network boundary
        run: python3 scripts/check_network_boundary.py
      - name: AGENTS.md crate map matches the manifests
        run: python3 scripts/check_agents_map.py
      - name: Generated files are current (licences, icon catalog, emoji index)
        run: |
          cargo fetch --locked
          python3 scripts/gen_third_party_licenses.py --check
          python3 assets/icons/generate.py --check-text
          python3 -I assets/emoji/generate.py --check

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Advisories, licences, duplicate versions and sources; see deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: 1.99.0

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
          components: clippy
      - name: Install native video/audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libva-dev libpipewire-0.3-dev clang
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Without fastcord-fake in the invocation its dev-dependency cannot turn
      # fake-discord on, so this is the configuration that ships (#160).
      - run: cargo clippy --workspace --exclude fastcord-fake --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude fastcord-fake --all-targets --locked
      - name: Fake server and debug-only fake mode
        run: |
          cargo clippy -p fastcord-fake -p fastcord-discord -p fastcord-app --features fastcord-app/fake-discord --all-targets --locked -- -D warnings
          cargo test -p fastcord-fake --locked
      - name: Validate vendored Blocks runtime compatibility
        if: runner.os == 'macOS'
        run: |
          cargo rustc --locked -p block --lib -- -D warnings
          rustc --edition=2024 --test vendor/block/tests/runtime.rs --extern block=target/debug/libblock.rlib -D warnings -o target/block-runtime-tests
          ./target/block-runtime-tests

  macos-intel-codec:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check -p fastcord-video --all-targets --locked --target x86_64-apple-darwin
